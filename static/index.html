<!DOCTYPE html>
<html>
<head>
    <title>Supastan AI Liquidity Scanner</title>

    <style>

    body{
        background:#0d1117;
        color:white;
        font-family:Arial;
        text-align:center;
        padding:30px;
    }

    .card{
        background:#161b22;
        max-width:420px;
        margin:auto;
        padding:30px;
        border-radius:20px;
        box-shadow:0 0 15px #000;
    }

    h1{
        color:#00ff99;
    }

    button{
        width:100%;
        padding:18px;
        font-size:22px;
        border:none;
        border-radius:12px;
        background:#00ff99;
        cursor:pointer;
        margin-top:20px;
    }

    #result{
        margin-top:25px;
        text-align:left;
        background:#0d1117;
        padding:20px;
        border-radius:12px;
        white-space:pre-wrap;
        font-size:18px;
    }

    </style>

</head>

<body>

<div class="card">

<h1>Supastan AI Liquidity Scanner</h1>

<p>Click below to scan Volatility 75 Index.</p>

<button onclick="scan()">Scan Market</button>

<div id="result">Waiting for scan...</div>

</div>

<script>

async function scan(){

document.getElementById("result").innerHTML="Scanning...";

let response=await fetch("/scan/R_75");

let data=await response.json();

document.getElementById("result").innerHTML=
`
📊 SYMBOL: ${data.symbol}

🌍 MARKET:
${data.market}

⏰ TIMEFRAME:
${data.timeframe}

📈 TREND:
${data.analysis.trend}

🚦 SIGNAL:
${data.analysis.signal}

🎯 CONFIDENCE:
${data.analysis.confidence}

📝 REASON:
${data.analysis.reason}

💰 ENTRY:
${data.trade_setup.entry}

🛑 STOP LOSS:
${data.trade_setup.stop_loss}

🎯 TAKE PROFIT:
${data.trade_setup.take_profit}

⚖️ RISK/REWARD:
${data.trade_setup.risk_reward}

📉 CANDLES:
${data.candles}
`;

}

</script>

</body>

</html>
