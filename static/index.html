<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supastan AI Liquidity Scanner</title>

    <style>
        body{
            background:#0d1117;
            color:white;
            font-family:Arial,Helvetica,sans-serif;
            text-align:center;
            padding:40px;
        }

        .box{
            max-width:700px;
            margin:auto;
            background:#161b22;
            padding:30px;
            border-radius:12px;
        }

        h1{
            color:#00ff99;
        }

        button{
            background:#00ff99;
            color:black;
            border:none;
            padding:15px 30px;
            font-size:18px;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#00cc77;
        }

        #result{
            margin-top:20px;
            white-space:pre-wrap;
            text-align:left;
            background:#0d1117;
            padding:15px;
            border-radius:8px;
        }
    </style>
</head>

<body>

<div class="box">

<h1>Supastan AI Liquidity Scanner</h1>

<p>Click below to scan Volatility 75 Index.</p>

<button onclick="scan()">Scan Market</button>

<div id="result"></div>

</div>

<script>

async function scan(){

let response = await fetch("/scan/R_75");

let data = await response.json();

document.getElementById("result").innerHTML =
JSON.stringify(data,null,2);

}

</script>

</body>
</html>
