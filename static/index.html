<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Supastan AI Liquidity Scanner</title>

<style>

body{
    background:#0d1117;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    text-align:center;
    padding:40px;
}

.box{
    max-width:700px;
    margin:auto;
    background:#161b22;
    padding:30px;
    border-radius:12px;
}

h1{
    color:#00ff99;
}

button{
    background:#00ff99;
    color:black;
    border:none;
    padding:15px 30px;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
    width:100%;
}

button:hover{
    background:#00cc77;
}

#result{
    margin-top:20px;
    white-space:pre-wrap;
    text-align:left;
    background:#0d1117;
    padding:15px;
    border-radius:8px;
    line-height:1.7;
    font-size:17px;
}

</style>

</head>

<body>

<div class="box">

<h1>Supastan AI Liquidity Scanner</h1>

<p>Scan all major Deriv Volatility Indices.</p>

<button onclick="scan()">
Scan All Markets
</button>

<div id="result">
Click the button above to begin scanning.
</div>

</div>

<script>

async function scan(){

document.getElementById("result").innerHTML="🔄 Scanning all markets...";

const symbols=[
"R_10",
"R_25",
"R_50",
"R_75",
"R_100"
];

let output="";

for(const symbol of symbols){

try{

let response=await fetch("/scan/"+symbol);

let data=await response.json();

let icon="🟡";

if(data.analysis.signal==="BUY"){
icon="🟢";
}

if(data.analysis.signal==="SELL"){
icon="🔴";
}

output+=`
━━━━━━━━━━━━━━━━━━━━

${icon} ${symbol}

📈 Trend:
${data.analysis.trend}

🚦 Signal:
${data.analysis.signal}

🎯 Confidence:
${data.analysis.confidence}

📝 Reason:
${data.analysis.reason}

`;

}catch(error){

output+=`
━━━━━━━━━━━━━━━━━━━━

❌ ${symbol}

Unable to scan market.

`;

}

}

document.getElementById("result").innerHTML=output;

}

</script>

</body>
</html>
